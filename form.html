<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=1.0">
        <title>Interactive Form</title>
        <link rel="stylesheet" href="form.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Ops+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sofia+Sans+Extra+Condensed:ital,wght@0,1..1000;1,1..1000&family=Staatliches&family=VT323&display=swap" rel="stylesheet">

    </head>
    <body>

        <div class="container">

            <div class="title-form">
                <h1>REGISTRATION FORM</h1>
            </div>
            
            <form action="/submit" method= "POST" class="form">

                <div class="name-section">
                    <label for="name">Full Name</label><br>
                    <input type="text" id="name" class="name" name="name" placeholder="Enter your name" required>
                    <div class="name-feedback"></div>
                </div>

                <br>

                <div class="email-section">
                    <label for="email">Email Address</label><br>
                    <input type="email" id="email" class="email-input" name="email" placeholder="Enter your Email" required>
                    <div class="email-feedback"></div>
                </div>

                <br>

                <div class="phone-section">
                    <label for="phone">Phone Number</label><br>
                    <input type="tel" id="phone" class="phone-number" name="phone" placeholder="Enter your Phone number" required>
                    <div class="phone-feedback"></div>
                </div>

                <br>

                <div class="password-section">
                    <label for="pass">Password</label><br>
                    <input type="password" id="pass" class="pass-word" name="pass" placeholder="Enter your password" required>
                    <div class="password-feedback"></div>
                </div>
                <br>

                <button type="submit" class="submit-btn">Register</button>

            </form>
        </div>





        <script src="form.js"></script>
    </body>
</html>
