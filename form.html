<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width , initial-scale=1.0">
        <title>Interactive Form</title>
        <link rel="stylesheet" href="form.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Ops+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sofia+Sans+Extra+Condensed:ital,wght@0,1..1000;1,1..1000&family=Staatliches&family=VT323&display=swap" rel="stylesheet">

    </head>
    <body>

        <div class="container">

            <div class="title-form">
                <h1>REGISTRATION FORM</h1>
            </div>
            
            <form action="/submit" method= "POST" class="form">

                <div class="name-section">
                    <label for="name" class="label">Full Name</label><br>

                    <div class="input-wrapper">

                        <input type="text" id="name" class="field full-name" name="name" placeholder="Enter your name" required>
                        <span class="validation-icon name-icon"></span>

                    </div>

                    <div class="feedback names"></div>
                </div>

                <br>

                <div class="email-section">
                    <label for="email" class="label">Email Address</label><br>

                    <div class="input-wrapper">

                        <input type="email" id="email" class="field ema-il" name="email" placeholder="Enter your Email" required>
                        <span class="validation-icon email-icon"></span>

                    </div>

                    <div class="feedback email-address"></div>
                </div>

                <br>

                <div class="phone-section" >
                    <label for="phone" class="label">Phone Number</label><br>

                    <div class="input-wrapper">

                        <input type="tel" id="phone" class="field number" name="phone" placeholder="Enter your Phone number" required>
                        <span class="validation-icon phone-icon"></span>

                    </div>

                    <div class="feedback phone-number"></div>
                </div>

                <br>

                <div class="password-section">
                    <label for="pass" class="label">Password</label><br>

                    <div class="input-wrapper">

                        <input type="password" id="pass" class="field pass-word" name="pass" placeholder="Enter your password" required>
                        <span class="validation-icon password-icon"></span>

                    </div>

                    <div class="feedback password-strength"></div>
                </div>
                <br>

                <button type="submit" class="submit-btn" disabled>Register</button>
                <div class="form-feedback"></div>
            </form>
        </div>

        <script src="form.js"></script>
    </body>
</html>
