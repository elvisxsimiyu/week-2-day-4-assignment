<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Priority List</title>

        <link rel="stylesheet" href="drag.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    </head>

    <body>

        <div class="page-title">
            <h1>Priority List</h1>
            <p>Drag and drop to reorder your tasks</p>
        </div>

        <div class="container">

            <ul class="task-list">

                <li class="task" draggable="true">
                    <span class="priority">1.</span>
                    <span class="task-name">Deploy website</span>
                </li>

                <li class="task" draggable="true">
                    <span class="priority">2.</span>
                    <span class="task-name">Fix login bug</span>
                </li>

                <li class="task" draggable="true">
                    <span class="priority">3.</span>
                    <span class="task-name">Write tests</span>
                </li>

                <li class="task" draggable="true">
                    <span class="priority">4.</span>
                    <span class="task-name">Update documentation</span>
                </li>

                <li class="task" draggable="true">
                    <span class="priority">5.</span>
                    <span class="task-name">Review pull requests</span>
                </li>

            </ul>

        </div>

        <script src="drag.js"></script>
    </body>
</html>
